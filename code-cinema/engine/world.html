  if ((seg.weather || []).includes('rain')) world.userData.rain = parts(3000, '#c8d8ff', .08);

// ------------------------------------------------------------------ ACTIONS (simple rigs, driven by time)
function act(o, action, t, lt, dur, talking, k) {
  const U = o.userData, R = U.R, d = U.def || {}; const ph = t * 1.0 + k;
  const sw = (sp, amp) => { (R.legs || []).forEach((l, i) => { l.rotation.z = Math.sin(t * sp + (i === 0 || i === 3 ? 0 : Math.PI)) * amp; }); };
  U.body.position.set(0, 0, 0); U.body.rotation.set(0, 0, 0);

  if (R.tail) R.tail.forEach((s, i) => s.rotation.x = Math.sin(t * 2 + i * .6 + k) * .18);
  if (R.head) { R.head.rotation.y = Math.sin(t * .7 + k) * .15; R.head.rotation.x = 0; }
  if (R.jaw) R.jaw.rotation.z = 0;
  if (R.trunk) R.trunk.forEach((s, i) => s.rotation.z = .12 + Math.sin(t * 1.5 + i) * .08);

  const speed = { walk: 1.4, run: 4.5, swim: 1.6, fly: 3, drive: 7, chase: 5 }[action] || 0;

  const home = U.home; o.position.copy(home); o.rotation.y = U.rot0;
  if (speed) { o.rotation.y = dir > 0 ? 0 : Math.PI; o.position.x = home.x + dir * speed * (lt - dur / 2) * (U.kind === 'biped' ? .8 : 1) * Math.max(.5, U.len * .6); }
  if (action === 'walk') { sw(U.kind === 'biped' ? 6 : 7, U.kind === 'biped' ? .5 : .45); U.body.position.y = Math.abs(Math.sin(t * 7)) * .03 * U.height; if (R.arms) R.arms.forEach((a, i) => a.rotation.z = Math.sin(t * 6 + (i ? 0 : Math.PI)) * .5); }
  if (action === 'run' || action === 'chase') { sw(14, .9); U.body.position.y = Math.abs(Math.sin(t * 14)) * .08 * U.height; U.body.rotation.z = -.08; if (R.arms) R.arms.forEach((a, i) => a.rotation.z = Math.sin(t * 14 + (i ? 0 : Math.PI)) * 1.0); }
  if (action === 'roar') { const r = clamp(Math.sin((lt % 2.4) / 2.4 * Math.PI) * 1.6); if (R.jaw) R.jaw.rotation.z = -.75 * r; if (R.head) { R.head.rotation.z = .25 * r; R.head.rotation.x = Math.sin(t * 40) * .03 * r; } if (R.mane) R.mane.scale.setScalar(1 + .06 * r); U.body.rotation.z = .05 * r; }

  if (action === 'sleep') { U.body.position.y = U.kind === 'quad' ? -(U.def && Q[U.def.type] ? Q[U.def.type].h : .5) * .85 * (U.def.scale || 1) : -U.height * .25; (R.legs || []).forEach((l, i) => l.rotation.z = (i < 2 ? 1.45 : -1.45)); if (R.head) { R.head.rotation.z = .4; } U.body.scale.y = 1 + Math.sin(t * 1.2) * .03; if (U.kind === 'biped') { U.body.rotation.x = Math.PI / 2; U.body.position.y = .2; } }
  if (action === 'eat') { if (R.neck) R.neck.rotation.z = -1.0 - .2 * Math.sin(t * 2); if (R.head) R.head.rotation.z = -.3 + .2 * Math.sin(t * 6); }
  if (action === 'sit') { (R.legs || []).forEach((l, i) => l.rotation.z = i >= 2 ? 1.2 : 0); U.body.rotation.z = .35; U.body.position.y = -U.height * .1; if (U.kind === 'biped') { R.legs.forEach(l => l.rotation.z = 1.5); U.body.position.y = -.4 * U.height / 1.9; } }
  if (action === 'attack') { const c = (lt % 1.2) / 1.2, lunge = Math.sin(c * Math.PI) ** 2; o.position.x = home.x + (k % 2 ? -1 : 1) * lunge * U.len * .6; if (R.jaw) R.jaw.rotation.z = -.6 * lunge; if (R.arms) R.arms[0].rotation.z = -2.2 * lunge; sw(10, .4 * lunge); }
  if (action === 'look') { if (R.head) R.head.rotation.y = Math.sin(lt * 1.2) * .7; }

  if (action === 'happy' || action === 'dance') { o.position.y = home.y + Math.abs(Math.sin(t * 6)) * .12 * U.height; if (R.arms) R.arms.forEach((a, i) => a.rotation.x = (i ? 1 : -1) * (2.4 + Math.sin(t * 8) * .3)); if (R.tail) R.tail.forEach((s, i) => s.rotation.x = Math.sin(t * 9 + i) * .5); }
  if (action === 'drive' && R.wheels) R.wheels.forEach(w => w.rotation.z = -t * 9);
  if (U.kind === 'bird' || action === 'fly') { (R.wings || []).forEach(([w, z]) => w.rotation.x = z * Math.sin(t * 12) * .7); if (U.kind !== 'walkbird') o.position.y = home.y + 1 + Math.sin(t * 1.5) * .5; }
  if (U.kind === 'walkbird' && R.wings) R.wings.forEach(([w, z]) => w.rotation.x = z * (.2 + Math.abs(Math.sin(t * 3)) * .2));
  if (R.wings && U.kind === 'quad') R.wings.forEach(([w, z]) => w.rotation.x = z * (action === 'fly' ? Math.sin(t * 5) * .8 : .25));
  if (action === 'fly' && U.kind === 'quad') o.position.y = home.y + 4 + Math.sin(t * 1.4) * .8;
  if (U.swim || action === 'swim') { if (R.tail && R.tail[0]) R.tail[0].rotation.y = Math.sin(t * 8) * .5; U.body.rotation.y = Math.sin(t * 8) * .06; o.position.y = home.y + Math.sin(t * 1.3 + k) * .3; }
  if (talking && R.jaw && action !== 'roar') R.jaw.rotation.z = -(.15 + .15 * Math.sin(t * 22)) * (U.kind === 'biped' ? 0 : 1), R.head && (R.head.rotation.x = Math.sin(t * 9) * .04);
  if (talking && U.kind === 'biped' && R.jaw) R.jaw.position.y = -Math.abs(Math.sin(t * 20)) * .02;
}

// ------------------------------------------------------------------ CAMERA ANGLES (the skill's shot library, aimed at the actors)
const SHOT = {
  establishing: (c, s, x) => [[c.x + 6 - 4 * x, c.y + s * 4.5 - s * 2 * x, c.z + s * 9 - s * 3 * x], [c.x, c.y + s * .4, c.z]],
  wide:         (c, s, x) => [[c.x - s * 4 + s * 1.5 * x, c.y + s * 1.1, c.z + s * 5.5], [c.x, c.y + s * .5, c.z]],
  low_hero:     (c, s, x) => [[c.x + s * 1.6 - s * .8 * x, c.y + s * .18, c.z + s * 2.6 - s * .5 * x], [c.x, c.y + s * .8, c.z]],
  closeup:      (c, s, x, h, f) => [[h.x + f * s * (1.5 - .25 * x), h.y + s * .08, h.z + s * .55], [h.x, h.y - s * .05, h.z]],
  orbit:        (c, s, x) => { const a = .9 - x * 1.1, r = s * 3.6; return [[c.x + Math.sin(a) * r, c.y + s * 1.3, c.z + Math.cos(a) * r], [c.x, c.y + s * .5, c.z]]; },
  tracking:     (c, s, x) => [[c.x - s * .5, c.y + s * .7, c.z + s * 4], [c.x + s * .2, c.y + s * .55, c.z]],
  aerial:       (c, s, x) => { const a = x * .8; return [[c.x + Math.sin(a) * s * 2, c.y + s * 7, c.z + Math.cos(a) * s * 2 + s * .5], [c.x, c.y, c.z]]; },
  dolly_in:     (c, s, x) => [[c.x + s * .8, c.y + s * .8, c.z + s * (5 - 2.6 * ease(x))], [c.x, c.y + s * .6, c.z]],
  pull_back:    (c, s, x) => [[c.x + s * .6, c.y + s * (.7 + 2 * x), c.z + s * (1.8 + 6 * ease(x))], [c.x, c.y + s * .5, c.z]],
  two_shot:     (c, s, x) => [[c.x + s * .4 * x, c.y + s * .9, c.z + s * 4.6], [c.x, c.y + s * .6, c.z]],
  over_shoulder:(c, s, x) => [[c.x - s * 2.2, c.y + s * 1.2, c.z + s * 1.4], [c.x + s * .5, c.y + s * .7, c.z]],
  dutch:        (c, s, x) => [[c.x + s * 2.4, c.y + s * .5, c.z + s * 2.2 - s * .4 * x], [c.x, c.y + s * .7, c.z]],
};
function frameCam(seg, lt, t) {
  const A = world.userData.actors || []; const dur = Math.max(.5, seg.dur);
  const focus = seg.focus != null && A[seg.focus] ? [A[seg.focus]] : A.length ? A : [];
  const c = new THREE.Vector3(), h = new THREE.Vector3(); let s = 1.6;
  if (focus.length) { focus.forEach(o => { c.add(o.position); }); c.divideScalar(focus.length); const o = focus[0]; s = Math.max(1.2, o.userData.height, o.userData.len * .8);
    if (focus.length > 1 && seg.shot === 'two_shot') { const span = focus[0].position.distanceTo(focus[focus.length - 1].position); s = Math.max(s, span * .55); }
    const hd = o.userData.R.head; if (hd) hd.getWorldPosition(h); else h.copy(o.position).add(new THREE.Vector3(0, o.userData.headY, 0)); }
  else { c.set(0, 0, 0); h.set(0, 1.5, 0); s = 3; }
  const x = clamp(lt / dur); const split = seg.split && lt > dur * .55; const shot = split ? seg.shot2 : seg.shot;
  const xx = split ? clamp((lt - dur * .55) / (dur * .45)) : (seg.split ? clamp(lt / (dur * .55)) : x);
  const fdir = focus.length && Math.cos(focus[0].rotation.y) < 0 ? -1 : 1; let [p, l] = (SHOT[shot] || SHOT.wide)(c, s, xx, h, fdir);
  const hh = (seg.handheld ?? 1) * s * .012; p = [p[0] + Math.sin(t * 1.3) * hh, p[1] + Math.sin(t * 1.7 + 1) * hh, p[2]];
  if ((seg.fx || []).includes('shake') || seg.action === 'roar') { const k = seg.action === 'roar' ? clamp(Math.sin((lt % 2.4) / 2.4 * Math.PI) * 1.6) : .6; p[0] += Math.sin(t * 61) * .05 * s * k; p[1] += Math.cos(t * 53) * .04 * s * k; }
  if (p[1] < .15) p[1] = .15;
  camera.position.set(...p); camera.lookAt(...l); const tall = H > W; camera.fov = shot === 'closeup' ? (tall ? 46 : 30) : shot === 'establishing' || shot === 'aerial' ? (tall ? 66 : 48) : (tall ? 58 : 40);
  camera.rotation.z += shot === 'dutch' ? .14 : 0; camera.updateProjectionMatrix();

}

// ------------------------------------------------------------------ CAPTIONS (bold uppercase, top third, word by word)
function captions(t) {
  const ws = WORDS.filter(w => t >= w.s - .05 && t < w.lineEnd); if (!ws.length) return;
  const line = ws[0].line; const grp = WORDS.filter(w => w.line === line); const idx = grp.findIndex(w => t >= w.s && t < (w.e + .15)); const cur = Math.max(0, idx < 0 ? grp.filter(w => w.s <= t).length - 1 : idx);
  const g0 = Math.floor(cur / 3) * 3, shown = grp.slice(g0, g0 + 3); let size = Math.round(W * .085);
  octx.font = `700 ${size}px Poppins, sans-serif`;
  { const wd = octx.measureText(shown.map(w => w.w.toUpperCase()).join(' ') + ' ').width; if (wd > W * .82) { size = Math.floor(size * W * .82 / wd); octx.font = `700 ${size}px Poppins, sans-serif`; } } octx.textAlign = 'center'; octx.textBaseline = 'middle'; octx.lineJoin = 'round';
  const text = shown.map(w => w.w.toUpperCase()); const widths = text.map(s => octx.measureText(s + ' ').width); const total = widths.reduce((a, b) => a + b, 0);
  let x = W / 2 - total / 2; const y = H * .25;
  shown.forEach((w, i) => { const on = g0 + i === cur, pop = on ? 1 + .12 * clamp(1 - (t - w.s) / .15) : 1; const cx = x + widths[i] / 2 - octx.measureText(' ').width / 2;
    octx.save(); octx.translate(cx, y); octx.scale(pop, pop); octx.lineWidth = size * .2; octx.strokeStyle = '#000'; octx.strokeText(text[i], 0, 0); octx.fillStyle = on ? (TL.cfg.hl || '#ffe34a') : '#fff'; octx.fillText(text[i], 0, 0); octx.restore(); x += widths[i]; });
}

// ------------------------------------------------------------------ main
window.init = tl => {
  TL = tl; [W, H] = tl.cfg.size || [1080, 1920]; SEGS = tl.segs; const gs = tl.cfg.glScale || 1;
  out = document.getElementById('c'); out.width = W; out.height = H; octx = out.getContext('2d');
  glc = document.createElement('canvas'); glc.id = 'gl'; document.body.appendChild(glc);
  renderer = new THREE.WebGLRenderer({ canvas: glc, antialias: true, preserveDrawingBuffer: true }); renderer.setSize(Math.round(W * gs), Math.round(H * gs), false);
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05; renderer.outputColorSpace = THREE.SRGBColorSpace;
  scene = new THREE.Scene(); camera = new THREE.PerspectiveCamera(40, W / H, .05, 1200);
  WORDS = []; SEGS.forEach((s, i) => { const end = (SEGS[i + 1] ? SEGS[i + 1].start : tl.total) + .0; (s.words || []).forEach(w => WORDS.push(Object.assign({}, w, { line: i, lineEnd: end }))); });
};
window.render = t => {
  let i = 0; while (i + 1 < SEGS.length && SEGS[i + 1].start <= t) i++; const seg = SEGS[i]; const lt = t - (i === 0 ? 0 : seg.start);
  const key = seg.scene; if (key !== curKey) { buildWorld(seg); curKey = key; }
  const A = world.userData.actors || []; const dur = (SEGS[i + 1] ? SEGS[i + 1].start : TL.total) - (i === 0 ? 0 : seg.start); seg.dur = dur;
  A.forEach((o, k) => { const a = (seg.acts && seg.acts[k]) || 'idle'; const talking = seg.speakerIdx === k && (seg.words || []).some(w => t >= w.s && t <= w.e); act(o, a, t, lt, dur, talking, k); });
  const ud = world.userData;
  if (ud.rain) { const p = ud.rain.geometry.attributes.position, b = ud.rain.userData.base; for (let j = 0; j < p.count; j++) p.setY(j, ((b[j * 3 + 1] - t * 22) % 30 + 30) % 30); p.needsUpdate = true; ud.rain.position.copy(camera.position).setY(0); }
  if (ud.snow) { const p = ud.snow.geometry.attributes.position, b = ud.snow.userData.base; for (let j = 0; j < p.count; j++) { p.setY(j, ((b[j * 3 + 1] - t * 1.6) % 30 + 30) % 30); p.setX(j, b[j * 3] + Math.sin(t + j) * .5); } p.needsUpdate = true; ud.snow.position.copy(camera.position).setY(0); }
  if (ud.bubbles) { const p = ud.bubbles.geometry.attributes.position, b = ud.bubbles.userData.base; for (let j = 0; j < p.count; j++) p.setY(j, (b[j * 3 + 1] + t * 1.5) % 30); p.needsUpdate = true; }

  renderer.render(scene, camera);
  octx.drawImage(glc, 0, 0, W, H);
  // lightning flash / night tint / vignette
  if ((seg.weather || []).includes('lightning') && (t % 3.1) < .15) { octx.fillStyle = `rgba(235,240,255,${.7 * (1 - (t % 3.1) / .15)})`; octx.fillRect(0, 0, W, H); }
  const vg = octx.createRadialGradient(W / 2, H / 2, H * .25, W / 2, H / 2, H * .75); vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.45)'); octx.fillStyle = vg; octx.fillRect(0, 0, W, H);
  if (i === 0 && lt < .4) { octx.fillStyle = `rgba(0,0,0,${1 - lt / .4})`; octx.fillRect(0, 0, W, H); }
  captions(t);
};
window.ready = true;
