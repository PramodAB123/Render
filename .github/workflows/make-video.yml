# Runs the whole pipeline on GitHub's free cloud runners (nothing runs on your PC).
# Daily at 13:30 UTC (7 PM India), or on demand: Actions tab > "Make video" > Run workflow.
name: Make video
# The run list shows mode, genre and branch, so you can see at a glance what each run made.
run-name: "${{ inputs.mode || 'stock' }} · ${{ inputs.genre || 'daily rotate' }} · ${{ inputs.length || '30 sec' }} · ${{ inputs.orientation || 'portrait' }} · ${{ github.ref_name }}"

on:
  schedule:
    - cron: "30 13 * * *"
  workflow_dispatch:
    inputs:
      genre:
        description: "Genre - changes script tone, clips, colours, voice, music and pacing"
        default: "horror"
        type: choice
        options: [horror, comedy, science, motivation, mystery, history]
      length:
        description: "Video length"
        default: "30 sec"
        type: choice
        options: [30 sec, 1 min, 3 min, 5 min, 10 min]
      orientation:
        description: "portrait 9:16 (Shorts / Reels) or landscape 16:9 (normal YouTube video)"
        default: "portrait"
        type: choice
        options: [portrait, landscape]
      mode:
        description: "Visuals: stock clips, ai images, mix, doc (documentary look), 2d (animated cartoon story), stick (stick-figure explainer), or cinema (3D room, Shorts only)"
        default: "stock"
        type: choice
        options: [stock, ai, mix, doc, 2d, stick, cinema]
      script:
        description: "Your own script (optional). Plain lines separated by | are read word for word. A screenplay (Scene 1 ... Visual: ... SFX: ... Narrator: \"...\" Dialogue - Name: \"...\") is understood: only Narrator/Dialogue are spoken, any language incl. Hindi"
        required: false
      reference:
        description: "Optional reference link (YouTube video or any web page) - the new video borrows its topic and tone, not its content"
        required: false
      idea:
        description: "Optional idea (leave empty to use trending YouTube ideas)"
        required: false
      upload:
        description: "Upload to YouTube"
        type: boolean
        default: true

jobs:
  make:
    if: ${{ github.event_name == 'schedule' || github.actor == github.repository_owner }}
    runs-on: ubuntu-latest
    timeout-minutes: 120   # safety cap so a stuck run can't use up your free minutes
    env:
      LLM_MODEL: llama3.2:3b
      PYTHONUNBUFFERED: "1"          # show progress lines live in the log
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
      TRANSFORMERS_VERBOSITY: error
      OLLAMA_MODELS: /home/runner/.ollama/models
      BROWSER_CHANNEL: ""            # use Playwright's bundled Chromium instead of Edge
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with: { python-version: "3.12", cache: pip }

      - uses: actions/setup-node@v7
        with: { node-version: "24" }

      - name: System packages (FFmpeg, fonts)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg fonts-dejavu-core
          sudo apt-get install -y -q fonts-inter fonts-noto-core || true   # Noto: Hindi and other scripts in captions

      # MIT-licensed animation kit by Artem Novitckii, pinned to a tested commit. The 2D engine uses its
      # OFL fonts (Inter Tight, Poppins) and follows its stick-figure skill rules (word-timed 1-2 word captions,
      # whip transitions, impacts, safe area, 2.7-3 words/s pacing).
      - name: claude-animation-skills (stick-figure engine + fonts)
        uses: actions/checkout@v7
        with:
          repository: artemnovitckii/claude-animation-skills
          ref: 5dbea55c23aa6a5c93dc3cfb5583840513b56b94
          path: vendor/animation-skills

      - name: Python + Node packages
        run: |
          pip install -q -r requirements.txt
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm install --silent

      - name: Chromium for the 3D cinema, 2D and stick modes
        if: ${{ inputs.mode == 'cinema' || inputs.mode == '2d' || inputs.mode == 'stick' }}
        run: npx playwright install --with-deps chromium

      - name: Free AI image model (CPU) for ai / mix visuals
        if: ${{ inputs.mode == 'ai' || inputs.mode == 'mix' || inputs.mode == 'doc' }}
        run: pip install -q torch --index-url https://download.pytorch.org/whl/cpu && pip install -q diffusers transformers accelerate safetensors

      - name: Restore the AI image model from cache
        id: hfcache
        if: ${{ inputs.mode == 'ai' || inputs.mode == 'mix' || inputs.mode == 'doc' }}
        uses: actions/cache/restore@v6
        with: { path: /home/runner/.cache/huggingface, key: "hf-dreamshaper-8-lcm" }

      - name: Restore Ollama (program + model) from cache
        id: ollamacache
        uses: actions/cache/restore@v6
        with:
          path: |
            /home/runner/.ollama/models
            /home/runner/ollama-bin
          key: "ollama-v2-${{ env.LLM_MODEL }}"

      # If Ollama can't be installed (its servers are sometimes down), this step is skipped
      # and the video is still made with the built-in genre template script.
      - name: Ollama (free local LLM on the runner)
        continue-on-error: true
        timeout-minutes: 15
        run: |
          B=$HOME/ollama-bin
          if [ ! -x "$B/bin/ollama" ]; then
            mkdir -p "$B"; ok=""
            for i in 1 2 3; do   # 1st choice: official GitHub release (no install script needed)
              for f in ollama-linux-amd64.tgz ollama-linux-amd64.tar.zst; do
                if curl -fL --retry 3 --retry-delay 5 -o /tmp/$f "https://github.com/ollama/ollama/releases/latest/download/$f"; then
                  case $f in *.tgz) tar -xzf /tmp/$f -C "$B";; *) tar --zstd -xf /tmp/$f -C "$B";; esac && ok=1 && break 2
                fi
              done
              sleep $((i * 10))
            done
            if [ -z "$ok" ]; then  # 2nd choice: the install script, with retries
              for i in 1 2 3; do curl -fsSL https://ollama.com/install.sh | sh && break; sleep $((i * 15)); done
              sudo systemctl stop ollama || true
              mkdir -p "$B/bin"; cp "$(command -v ollama)" "$B/bin/" || exit 1
            fi
          fi
          echo "$B/bin" >> "$GITHUB_PATH"; export PATH="$B/bin:$PATH"
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do curl -s localhost:11434 >/dev/null && break; sleep 1; done
          for i in 1 2 3; do ollama pull "$LLM_MODEL" && exit 0; sleep $((i * 10)); done
          exit 1

      - name: Make the video
        env:
          MODE: ${{ inputs.mode || 'stock' }}
          LENGTH: ${{ inputs.length || '30 sec' }}
          ORIENTATION: ${{ inputs.orientation || 'portrait' }}
          GENRE: ${{ inputs.genre || 'rotate' }}   # daily runs rotate through all genres
          IDEA: ${{ inputs.idea }}
          REFERENCE: ${{ inputs.reference }}
          SCRIPT: ${{ inputs.script }}
          WANT_UPLOAD: ${{ github.event_name == 'schedule' || inputs.upload }}
        run: |
          echo "branch: ${GITHUB_REF_NAME}  commit: ${GITHUB_SHA::7}  mode: $MODE  genre: $GENRE"
          if [ "$MODE" = "stick" ] && [ ! -f vendor/animation-skills/skills/stick-figure/engine/template/web/chars.js ]; then
            echo "stick mode needs the claude-animation-skills checkout, which is missing"; exit 1; fi
          ARGS=(--genre "$GENRE" --mode "$MODE" --length "$LENGTH" --orientation "$ORIENTATION")
          if [ -n "$IDEA" ]; then ARGS+=(--idea "$IDEA"); fi
          if [ -n "$REFERENCE" ]; then ARGS+=(--reference "$REFERENCE"); fi
          if [ -n "$SCRIPT" ]; then ARGS+=(--script "$SCRIPT"); fi
          if [ "$WANT_UPLOAD" = "true" ]; then
            if [ -n "$YT_REFRESH_TOKEN" ]; then ARGS+=(--upload); else echo "No YT_REFRESH_TOKEN secret yet - skipping upload"; fi
          fi
          python run.py "${ARGS[@]}"

      # Saved even if the run fails or is cancelled, so the big downloads happen only once.
      # A cache problem never fails the run (it only means the next run downloads again).
      - name: Prepare cache folders
        if: always()
        run: |
          mkdir -p /home/runner/.ollama/models /home/runner/ollama-bin /home/runner/.cache/huggingface
          rm -rf /home/runner/.cache/huggingface/hub/.locks /home/runner/.cache/huggingface/xet 2>/dev/null || true

      - name: Save the AI image model to cache
        continue-on-error: true
        if: ${{ always() && (inputs.mode == 'ai' || inputs.mode == 'mix' || inputs.mode == 'doc') && steps.hfcache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with: { path: /home/runner/.cache/huggingface, key: "hf-dreamshaper-8-lcm" }

      - name: Save Ollama to cache
        continue-on-error: true
        if: ${{ always() && steps.ollamacache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            /home/runner/.ollama/models
            /home/runner/ollama-bin
          key: "ollama-v2-${{ env.LLM_MODEL }}"

      - name: Keep the video (download from the run page for 14 days)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: video
          path: output/
          retention-days: 14
